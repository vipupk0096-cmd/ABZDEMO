<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bất động sản - ABZ GROUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        /* ===== PROPERTY DETAIL PAGE STYLES ===== */

        /* Main Layout */
        .detail-wrapper {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: var(--spacing-6);
            margin: var(--spacing-8) 0;
        }

        /* Main Content */
        .detail-main {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-8);
        }

        /* Image Gallery Section */
        .gallery-section {
            background-color: var(--color-white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .main-image-container {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: var(--color-bg-light);
            overflow: hidden;
        }

        .main-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-badge {
            position: absolute;
            top: var(--spacing-4);
            left: var(--spacing-4);
            background-color: var(--color-primary);
            color: var(--color-white);
            padding: var(--spacing-2) var(--spacing-4);
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-sm);
        }

        .image-controls {
            position: absolute;
            bottom: var(--spacing-4);
            right: var(--spacing-4);
            display: flex;
            gap: var(--spacing-2);
            background-color: rgba(0, 0, 0, 0.5);
            padding: var(--spacing-2);
            border-radius: var(--radius-md);
        }

        .image-controls button {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--color-white);
            border: none;
            padding: var(--spacing-2) var(--spacing-3);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: var(--font-size-base);
        }

        .image-controls button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .thumbnail-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: var(--spacing-2);
            padding: var(--spacing-4);
            background-color: var(--color-bg-lighter);
        }

        .thumbnail {
            width: 100%;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border-radius: var(--radius-md);
            border: var(--border-width-2) solid transparent;
            transition: var(--transition-fast);
        }

        .thumbnail:hover,
        .thumbnail.active {
            border-color: var(--color-primary);
        }

        /* Property Info Section */
        .property-info-section {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .property-header {
            margin-bottom: var(--spacing-6);
            padding-bottom: var(--spacing-6);
            border-bottom: var(--border-width-1) solid var(--color-border-light);
        }

        .property-title {
            font-size: var(--font-size-4xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-3);
            color: var(--color-dark);
        }

        .property-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-3);
            align-items: center;
            margin-bottom: var(--spacing-4);
        }

        .property-price-large {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
        }

        .property-location-detail {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            color: var(--color-text-light);
            font-size: var(--font-size-base);
            margin-bottom: var(--spacing-3);
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-6);
        }

        .spec-item {
            padding: var(--spacing-4);
            background-color: var(--color-bg-lighter);
            border-radius: var(--radius-md);
            text-align: center;
        }

        .spec-label {
            display: block;
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-2);
            font-weight: var(--font-weight-medium);
        }

        .spec-value {
            display: block;
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
        }

        /* Description Section */
        .description-section {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .description-section h2 {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-4);
            color: var(--color-dark);
        }

        .description-section p {
            line-height: var(--line-height-relaxed);
            color: var(--color-text);
            margin-bottom: var(--spacing-4);
        }

        /* Sidebar */
        .detail-sidebar {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-6);
        }

        /* Agent Card */
        .agent-card {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .agent-avatar {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-full);
            background-color: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto var(--spacing-4);
        }

        .agent-name {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            color: var(--color-dark);
            margin-bottom: var(--spacing-1);
        }

        .agent-role {
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-4);
        }

        .agent-info {
            text-align: left;
            margin-bottom: var(--spacing-4);
            font-size: var(--font-size-sm);
        }

        .agent-info p {
            margin: var(--spacing-2) 0;
            color: var(--color-text);
        }

        .agent-info strong {
            color: var(--color-dark);
            display: block;
            margin-bottom: var(--spacing-1);
        }

        .agent-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-2);
        }

        .agent-actions .btn {
            width: 100%;
            text-align: center;
        }

        /* Inquiry Form */
        .inquiry-widget {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--color-primary);
        }

        .inquiry-widget h3 {
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-4);
            color: var(--color-dark);
        }

        .inquiry-form .form-group {
            margin-bottom: var(--spacing-4);
        }

        .inquiry-form .form-control {
            font-size: 16px;
        }


        /* Verification / Trusted Info */
        .verify-card {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: var(--spacing-5);
            border: var(--border-width-1) solid var(--color-border-light);
        }

        .verify-card .verify-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            font-weight: var(--font-weight-semibold);
            color: var(--color-dark);
            margin: 0 0 var(--spacing-4) 0;
        }

        .verify-card .verify-title .verify-icon {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--color-success);
            color: var(--color-white);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            line-height: 1;
            flex: 0 0 auto;
        }

        .verify-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: var(--spacing-3);
        }

        .verify-list li {
            display: flex;
            gap: var(--spacing-3);
            align-items: flex-start;
            color: var(--color-text);
            font-size: var(--font-size-sm);
        }

        .verify-list li .li-icon {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            background: #e8f2ff;
            color: #0b5ed7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
            flex: 0 0 auto;
            margin-top: 2px;
        }

        .verify-link {
            display: inline-flex;
            margin-top: var(--spacing-4);
            color: var(--color-primary);
            text-decoration: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }

        /* Property Features (Specs) */
        .features-section {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .features-section h2 {
            margin: 0 0 var(--spacing-5) 0;
            font-size: var(--font-size-xl);
            color: var(--color-dark);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--spacing-4) var(--spacing-8);
        }

        .feature-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-4);
            padding-bottom: var(--spacing-3);
            border-bottom: var(--border-width-1) solid var(--color-border-light);
            min-height: 44px;
        }

        .feature-row .feature-left {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-3);
            color: var(--color-dark);
            font-weight: var(--font-weight-medium);
        }

        .feature-row .feature-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            background: var(--color-bg-lighter);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
            font-size: 14px;
            flex: 0 0 auto;
        }

        .feature-row .feature-value {
            color: var(--color-text);
            font-weight: var(--font-weight-semibold);
            white-space: nowrap;
        }

        /* Map */
        .map-section {
            background-color: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .map-section h2 {
            margin: 0 0 var(--spacing-4) 0;
            font-size: var(--font-size-xl);
            color: var(--color-dark);
        }

        .map-embed {
            width: 100%;
            height: 320px;
            border: 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--color-bg-lighter);
        }

        .map-meta {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--spacing-4);
            padding-top: var(--spacing-4);
            margin-top: var(--spacing-4);
            border-top: var(--border-width-1) solid var(--color-border-light);
            font-size: var(--font-size-sm);
        }

        .map-meta .meta-label {
            color: var(--color-text-light);
            display: block;
            margin-bottom: var(--spacing-1);
        }

        .map-meta .meta-value {
            color: var(--color-dark);
            font-weight: var(--font-weight-semibold);
        }
        /* Related Properties */
        .related-section {
            margin-top: var(--spacing-12);
            padding-top: var(--spacing-12);
            border-top: var(--border-width-1) solid var(--color-border-light);
        }

        .related-section h2 {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-6);
            color: var(--color-dark);
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--spacing-6);
        }

        /* Not Found */
        .property-not-found {
            text-align: center;
            padding: var(--spacing-16) var(--spacing-4);
        }

        .property-not-found h2 {
            margin-bottom: var(--spacing-4);
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .detail-wrapper {
                grid-template-columns: 1fr;
            }

            .detail-sidebar {
                order: -1;
            }

            .main-image-container {
                height: 400px;
            }

            .property-title {
                font-size: var(--font-size-3xl);
            }
        }

        @media (max-width: 767px) {
            .detail-wrapper {
                margin: var(--spacing-4) 0;
            }

            .main-image-container {
                height: 300px;
            }

            .property-info-section,
            .description-section,
            .verify-card,
            .features-section,
            .map-section,
            .agent-card,
            .inquiry-widget {
                padding: var(--spacing-4);
            }

            .property-title {
                font-size: var(--font-size-2xl);
            }

            .property-meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .specs-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .map-meta {
                grid-template-columns: repeat(2, 1fr);
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .thumbnail-gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <div id="propertyDetail">
            <!-- Chi tiết bất động sản sẽ được load từ dataManager -->
        </div>

        <div id="propertyNotFound" style="display: none;">
            <div class="property-not-found">
                <h2 style="font-size: var(--font-size-4xl); margin-bottom: var(--spacing-4);">Không tìm thấy bất động sản</h2>
                <p style="color: var(--color-text-light); margin-bottom: var(--spacing-6); font-size: var(--font-size-lg);">Bất động sản bạn tìm kiếm có thể đã được xóa hoặc không tồn tại.</p>
                <a href="../index.html" class="btn btn-primary btn-lg">← Về Trang Chủ</a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../js/main.js"></script>
    <script src="../js/auth-state.js"></script>
    <script src="../js/dataManager.js"></script>
    <script src="../js/property-detail.js"></script>
</body>
</html>
